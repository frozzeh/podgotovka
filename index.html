<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>calculus · podgotovka</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#20352f;font:17px/1.6 system-ui,sans-serif}header,main,footer{max-width:1080px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;border-bottom:1px solid #d5ddd4}.brand{font-weight:800}small,.muted{color:#61736b}h1{font:clamp(36px,6vw,64px)/1.08 Georgia,serif;max-width:760px;margin:18px 0}h2{line-height:1.25}button{font:inherit;cursor:pointer;border:1px solid #cbd5cb;border-radius:12px;background:white;color:inherit;padding:12px 19px}button:hover{border-color:#237a5d;background:#edf4eb}button:focus-visible{outline:3px solid #e4ad55;outline-offset:3px}button.primary{background:#245d48;color:white;border-color:#245d48}.hero{padding:28px 0 38px}.tag{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#477059}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #dce2d8;border-radius:20px;padding:25px}.card p{color:#61736b}.num{font:32px Georgia;color:#8d9f7b}.actions{display:flex;gap:12px;flex-wrap:wrap}.question{font:28px/1.5 Georgia,serif;white-space:pre-wrap;margin:26px 0}.options{display:grid;gap:10px}.options button{text-align:left}.selected{background:#dcebdc!important;border:2px solid #245d48!important}.bar{height:7px;background:#e0e5dc;border-radius:9px;overflow:hidden;margin:16px 0}.bar span{display:block;background:#729761;height:100%}.feedback{padding:18px;border-radius:12px;background:#edf3e8;margin:20px 0;white-space:pre-line}.bad{background:#fff0df}details{margin:20px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;font:inherit}footer{font-size:13px;color:#61736b}#app{min-height:400px}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:13px;background:#e8eddf;border-radius:30px;padding:5px 12px}.result{font:52px Georgia}.report{width:100%;min-height:200px;padding:16px;font:14px/1.5 monospace} @media(max-width:700px){.grid{grid-template-columns:1fr}header,main,footer{padding:20px}.card{padding:20px}header small{display:none}.question{font-size:24px}}
</style>
<header><div class="brand">ƒ &nbsp; calculus</div><small>podgotovka · Первые шаги к Calculus I</small><button id="home">На главную</button></header><main id="app"></main><footer>Без таймера и оценок. Прогресс хранится только в этом браузере, если браузер разрешает сохранение. Для передачи результатов используй отчёт.</footer>
<script>
const topics=['Алгебра','Функции','Область определения'];
// Последнее значение — индекс правильного ответа; решения написаны отдельно для каждой задачи.
const bank=[
 [0,'Реши уравнение: 3x − 7 = 8',['x = 5','x = 1/3','x = −5','x = 15'],0,'Прибавляем 7 к обеим частям: 3x = 15. Делим на 3: x = 5. Проверка: 15 − 7 = 8.'],
 [0,'Разложи на множители: x² − 5x + 6',['(x − 2)(x − 3)','(x + 2)(x + 3)','(x − 1)(x − 6)','(x − 2)²'],0,'Ищем два числа с суммой −5 и произведением 6: −2 и −3. Получаем (x − 2)(x − 3).'],
 [0,'Упрости (x² − 4)/(x − 2), сохранив ограничения.',['x + 2 при x ≠ 2','x + 2 при любом x','x − 2 при x ≠ 2','x + 2 при x ≠ −2'],0,'Знаменатель не может быть нулём: x ≠ 2. Числитель: (x − 2)(x + 2). Сокращаем общий множитель, но сохраняем x ≠ 2.'],
 [0,'Вычисли: (−3)² − 2·(−3)',['15','3','−3','−15'],0,'(−3)² = 9, а −2·(−3) = 6. Значит, 9 + 6 = 15.'],
 [0,'Реши: 2(x − 3) = 10',['x = 8','x = 2','x = 5','x = 13'],0,'Делим на 2: x − 3 = 5. Прибавляем 3: x = 8.'],
 [0,'Раскрой скобки: (a + 1)²',['a² + 2a + 1','a² + 1','a² + a + 1','2a + 2'],0,'(a + 1)(a + 1) = a² + a + a + 1 = a² + 2a + 1.'],
 [0,'Реши неравенство: −2x > 6',['x < −3','x > −3','x < 3','x > 3'],0,'При делении неравенства на отрицательное число знак меняется. Делим на −2: x < −3.'],
 [0,'Упрости: (x² − 9)/(x + 3)',['x − 3 при x ≠ −3','x + 3 при x ≠ −3','x − 3 при любом x','x − 3 при x ≠ 3'],0,'x² − 9 = (x − 3)(x + 3). Сокращаем x + 3 при условии x ≠ −3.'],
 [1,'Что обязательно для функции?',['Каждому допустимому входу соответствует ровно один выход','Разным входам всегда соответствуют разные выходы','График обязательно прямая','В формуле обязательно есть x²'],0,'Один вход должен давать ровно один выход. При этом разные входы могут давать один результат: например, (−2)² = 2² = 4.'],
 [1,'f(x) = x² − 3x. Найди f(2).',['−2','2','−4','10'],0,'Вместо каждого x ставим 2: f(2) = 2² − 3·2 = 4 − 6 = −2.'],
 [1,'f(x) = x² − 3x. Найди f(−1).',['4','−2','2','−4'],0,'f(−1) = (−1)² − 3(−1) = 1 + 3 = 4. Отрицательный вход берём в скобки.'],
 [1,'f(x) = x² − 3x. Найди f(a + 1).',['a² − a − 2','a² + 1 − 3a','a² − 3a + 1','a² + 5a + 4'],0,'f(a + 1) = (a + 1)² − 3(a + 1) = a² + 2a + 1 − 3a − 3 = a² − a − 2.'],
 [1,'Что означает запись f(2)?',['Значение функции при входе 2','f, умноженное на 2','Два значения функции','Значение x, при котором f(x) = 2'],0,'Число в скобках — вход функции. f(2) означает результат подстановки x = 2.'],
 [1,'g(t) = 2t + 1. Найди g(3).',['7','6','9','5'],0,'Название переменной не меняет правило подстановки: g(3) = 2·3 + 1 = 7.'],
 [1,'f(x) = x². Чему равны f(−2) и f(2)?',['Оба равны 4','−4 и 4','Оба равны −4','−2 и 2'],0,'(−2)² = 4 и 2² = 4. Разные входы могут иметь одинаковый выход.'],
 [1,'f(x) = 3x − 2. Найди f(a + 2).',['3a + 4','3a','3a + 2','a + 4'],0,'Подставляем всё выражение: 3(a + 2) − 2 = 3a + 6 − 2 = 3a + 4.'],
 [2,'Найди область определения: 1/(x − 3)',['Все действительные x, кроме 3','x > 3','x ≥ 3','Все действительные x'],0,'Исключаем ноль в знаменателе: x − 3 ≠ 0, поэтому x ≠ 3.'],
 [2,'Найди область определения: √(x + 2)',['x ≥ −2','x > −2','x ≤ −2','x ≠ −2'],0,'Для действительного квадратного корня x + 2 ≥ 0. Получаем x ≥ −2. Граница входит: √0 = 0.'],
 [2,'Найди область определения: 1/√(x + 2)',['x > −2','x ≥ −2','x ≠ −2','x < −2'],0,'Подкоренное выражение должно быть неотрицательным, а знаменатель — ненулевым. Вместе это даёт x + 2 > 0, то есть x > −2.'],
 [2,'Найди область определения: x² − 3x',['Все действительные x','x ≥ 0','x ≠ 0','x ≥ 3'],0,'Многочлен можно вычислить при любом действительном x: здесь нет ни деления на выражение с x, ни корня.'],
 [2,'Найди область определения: √(5 − x)',['x ≤ 5','x ≥ 5','x < 5','x ≠ 5'],0,'5 − x ≥ 0. Переносим: −x ≥ −5. Умножаем на −1 и меняем знак: x ≤ 5.'],
 [2,'Найди область определения: 1/(x² − 4)',['x ≠ −2 и x ≠ 2','Только x ≠ 2','x > 2','Все действительные x'],0,'x² − 4 = 0 при x = −2 и x = 2. Исключаем оба значения, чтобы не делить на ноль.'],
 [2,'Найди область определения: √x/(x − 1)',['x ≥ 0 и x ≠ 1','x > 0','x ≠ 1','x ≥ 1'],0,'Корень требует x ≥ 0. Знаменатель требует x ≠ 1. Оба условия должны выполняться одновременно.'],
 [2,'Найди область определения: (x − 2)/(x − 2)',['Все действительные x, кроме 2','Все действительные x','Только x = 2','x > 2'],0,'Даже если дробь сокращается до 1, исходное выражение не определено при x = 2: получится 0/0.']
];
const theory=[
 'Уравнение сохраняет равенство, если выполнить одно и то же действие с обеими частями.\n\n(a + b)² = a² + 2ab + b²\na² − b² = (a − b)(a + b)\n\nСокращать в дроби можно общие множители. Ограничения исходного знаменателя сохраняются. При делении неравенства на отрицательное число знак меняется.',
 'Функция каждому допустимому входу даёт ровно один выход. f(x) — результат, а не умножение f на x.\n\nЕсли f(x) = x² − 3x, то f(2) = 4 − 6 = −2.\n\nЧтобы найти f(a + 1), заменяем каждый x всем выражением (a + 1). Разные входы могут давать одинаковые выходы.',
 'Область определения — все допустимые входные значения. Работаем с действительными числами.\n\n1. Знаменатель ≠ 0.\n2. Выражение под квадратным корнем ≥ 0.\n3. Если корень в знаменателе, выражение под ним > 0.\n4. Если ограничений несколько, выполняем их одновременно.\n\nПример: √(x + 2) определён при x ≥ −2. В записи [−2; +∞) квадратная скобка означает, что −2 включено.'
];
let data={attempts:[],last:null},storageOK=true;try{const saved=JSON.parse(localStorage.getItem('functions-v1'));if(saved&&Array.isArray(saved.attempts))data=saved}catch{storageOK=false}
let run=null,selection=null,checked=false;const app=document.querySelector('#app');
function persist(){try{localStorage.setItem('functions-v1',JSON.stringify(data))}catch{storageOK=false}}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function stats(t){const a=data.attempts.filter(x=>x.t===t);return a.length?`${a.filter(x=>x.ok).length} из ${a.length} верно с первой попытки`:'Пока нет попыток'}
function home(){run=null;app.innerHTML=`<section class="hero"><div class="tag">Понимать, а не угадывать</div><h1>Большая математика.<br>Маленькие шаги.</h1><p class="muted">Сначала узнаем, что уже получается. Потом спокойно разберём трудные места.</p><div class="actions"><button class="primary" id="diag">Пройти диагностику · 12 вопросов</button><button id="report">Мой прогресс</button></div><p><small>Без подсказок • примерно 10–15 минут • бумага пригодится</small></p></section><div class="grid">${topics.map((t,i)=>`<section class="card"><div class="num">0${i+1}</div><h2>${t}</h2><p>${['Уравнения, скобки и дроби. Основа для следующих тем.','Вход, выход и подстановка. Учимся читать f(x).','Какие x подходят? Знаменатели, корни и ограничения.'][i]}</p><small>${stats(i)}</small><p><button data-topic="${i}">Разобрать и потренироваться →</button></p></section>`).join('')}</div><p class="muted">Это стартовая проверка перед Calculus I: до пределов и производных. Выбор ответа помогает найти пробелы, но полезно ещё объяснить решение вслух.</p>${!storageOK?'<p>Браузер не разрешает сохранение. Скачай отчёт перед закрытием.</p>':''}`;document.querySelector('#diag').onclick=()=>start('diag');document.querySelector('#report').onclick=report;document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>lesson(+b.dataset.topic))}
function lesson(t){app.innerHTML=`<p class="tag">Повторение · 0${t+1}</p><h1>${topics[t]}</h1><section class="card"><pre>${theory[t]}</pre><button class="primary" id="practice">Практика · 8 заданий</button></section>`;document.querySelector('#practice').onclick=()=>start('practice',t)}
function start(mode,t){const ids=mode==='diag'?topics.flatMap((_,i)=>shuffle(bank.map((q,j)=>q[0]===i?j:-1).filter(j=>j>=0)).slice(0,4)):shuffle(bank.map((q,j)=>q[0]===t?j:-1).filter(j=>j>=0));run={mode,ids,pos:0,answers:[],orders:ids.map(id=>shuffle(bank[id][2].map((_,i)=>i)))};draw()}
function draw(){selection=null;checked=false;const q=bank[run.ids[run.pos]],order=run.orders[run.pos];app.innerHTML=`<div class="split"><span class="tag">${run.mode==='diag'?'Диагностика':'Практика'} · ${topics[q[0]]}</span><span class="pill">${run.pos+1} / ${run.ids.length}</span></div><div class="bar"><span style="width:${run.pos/run.ids.length*100}%"></span></div><section class="card"><p class="muted">Реши на бумаге, затем выбери ответ. Можно честно пропустить.</p><div class="question">${q[1]}</div><div class="options">${order.map(i=>`<button data-answer="${i}" aria-pressed="false">${q[2][i]}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="actions" style="margin-top:24px"><button class="primary" id="check">${run.mode==='diag'?'Ответить':'Проверить'}</button><button id="skip">Пока не знаю</button></div></section>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(checked)return;selection=+b.dataset.answer;document.querySelectorAll('[data-answer]').forEach(x=>{const active=x===b;x.classList.toggle('selected',active);x.setAttribute('aria-pressed',active)})});document.querySelector('#check').onclick=()=>{if(checked){next();return}if(selection===null){document.querySelector('#feedback').textContent='Выбери ответ или нажми «Пока не знаю».';return}answer(selection)};document.querySelector('#skip').onclick=()=>answer(null)}
function answer(choice){if(checked)return;const id=run.ids[run.pos],q=bank[id],ok=choice===q[3];run.answers.push({id,t:q[0],ok,skipped:choice===null,choice});if(run.mode==='diag'){next();return}checked=true;document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);document.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'Верно!':choice===null?'Разберём вместе.':'Пока не получилось.'}\n${q[4]}</div>`;document.querySelector('#check').textContent='Дальше →';document.querySelector('#skip').hidden=true}
function next(){run.pos++;if(run.pos>=run.ids.length){finish();return}draw()}
function finish(){const result={mode:run.mode,answers:run.answers,date:new Date().toLocaleDateString('ru-RU')};data.attempts.push(...result.answers.map(a=>({...a,date:result.date,mode:result.mode})));data.last=result;persist();run=null;showResult(result)}
function recommendation(answers){const groups=topics.map((_,t)=>answers.filter(a=>a.t===t));const weak=groups.findIndex(g=>g.length&&g.filter(a=>a.ok).length/g.length<.75);return weak>=0?`Начни с темы «${topics[weak]}». Повтори правило, затем пройди практику.`:'С этой подборкой получилось хорошо. Объясни несколько решений вслух; дальше можно переходить к графикам и наклону.'}
function showResult(r){app.innerHTML=`<p class="tag">${r.mode==='diag'?'Диагностика завершена':'Практика завершена'}</p><h1>Теперь понятнее,<br>с чего начать.</h1><div class="card"><div class="result">${r.answers.filter(a=>a.ok).length} / ${r.answers.length}</div><p>Верных ответов с первой попытки. Пропуски учитываются отдельно в отчёте.</p><p>${recommendation(r.answers)}</p><div class="grid">${topics.map((t,i)=>{const a=r.answers.filter(x=>x.t===i);return a.length?`<div><b>${t}</b><p>${a.filter(x=>x.ok).length} / ${a.length}</p><button data-review="${i}">Повторить тему</button></div>`:''}).join('')}</div></div><h2>Разбор каждого задания</h2>${r.answers.map(a=>`<details class="card"><summary>${a.ok?'✓':a.skipped?'○':'↻'} ${bank[a.id][1]}</summary><p>Твой ответ: ${a.choice===null?'Пропуск':bank[a.id][2][a.choice]}</p><b>Правильный ответ: ${bank[a.id][2][bank[a.id][3]]}</b><p>${bank[a.id][4]}</p></details>`).join('')}<button id="export">Открыть отчёт для передачи</button>`;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>lesson(+b.dataset.review));document.querySelector('#export').onclick=report}
function reportText(){return 'СНАЧАЛА ФУНКЦИИ — ОТЧЁТ\n'+topics.map((t,i)=>t+': '+stats(i)).join('\n')+'\n\nПоследняя завершённая сессия:\n'+(data.last?data.last.date+' · '+(data.last.mode==='diag'?'Диагностика':'Практика')+'\n'+data.last.answers.map(a=>(a.ok?'ВЕРНО':a.skipped?'ПРОПУСК':'ОШИБКА')+' — '+bank[a.id][1]+'\nОтвет: '+(a.choice===null?'пропуск':bank[a.id][2][a.choice])).join('\n')+'\n\n'+recommendation(data.last.answers):'Пока нет завершённых сессий.')}
function report(){app.innerHTML='<p class="tag">Твой маршрут</p><h1>Прогресс и отчёт</h1><p>Общие счётчики включают все завершённые сессии. Отчёт с последней сессией можно переслать другу.</p><textarea class="report" readonly aria-label="Отчёт о прогрессе"></textarea><div class="actions"><button class="primary" id="download">Скачать .txt</button><button id="last">Последний разбор</button><button id="reset">Сбросить прогресс</button></div>';document.querySelector('textarea').value=reportText();document.querySelector('#download').onclick=()=>{const u=URL.createObjectURL(new Blob([reportText()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='functions-report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.querySelector('#last').onclick=()=>{if(data.last)showResult(data.last);else document.querySelector('textarea').value='Сначала заверши диагностику или практику.'};document.querySelector('#reset').onclick=()=>{if(confirm('Удалить весь сохранённый прогресс в этом браузере?')){data={attempts:[],last:null};persist();home()}}}
document.querySelector('#home').onclick=()=>{if(run&&!confirm('Выйти из текущей сессии? Незавершённые ответы не сохранятся.'))return;home()};home();
</script>
<style>
label{display:block;font-size:15px;font-weight:600;margin:14px 0}input,select,textarea{display:block;width:100%;font:inherit;color:inherit;background:#fff;border:1px solid #b8c7ba;border-radius:9px;padding:11px;margin-top:6px}textarea{resize:vertical;line-height:1.55}button:disabled{opacity:.55;cursor:wait}#account-message:empty{display:none}#account-message{white-space:pre-line;color:#8c4628}#cloud-status{font-size:14px;max-width:650px}header{gap:12px;flex-wrap:wrap}@media(max-width:700px){.grid>.card{grid-column:auto!important}.split{align-items:flex-start;flex-wrap:wrap}}
</style>
<script src="config.js"></script><script src="cloud.js"></script></html>
